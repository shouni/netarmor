# The CI itself lives in shouni/workflows. Its README explains the job layout and how tags are used.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1
    with:
      coverage: true
      upload-coverage: true
      # URL validation takes user input directly, so the fuzzers run on every build.
      fuzz-targets: "./securenet#FuzzValidateURL ./securenet#FuzzIsSecureServiceURL ./securenet#FuzzZonedLiteral"
      fuzz-time: 60s
