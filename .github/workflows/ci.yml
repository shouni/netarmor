# CI の実体は shouni/workflows。ジョブ構成とタグ運用の理由はそちらの README にある。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # カナリア: v1.3.0 の go-ci.yml を確認するための一時的なピン。
    # 緑を確認して v1 を移したら @v1 に戻すこと。
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1.3.0
    with:
      coverage: true
      upload-coverage: true
      # URL 検証はユーザー入力を直接受けるため、探索を毎回回す。
      fuzz-targets: "./securenet#FuzzValidateURL ./securenet#FuzzIsSecureServiceURL"
      fuzz-time: 60s
